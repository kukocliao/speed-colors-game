<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>著色快手 Speed Colors - 主控端</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center min-h-screen p-3 sm:p-6 select-none">

<header class="w-full max-w-5xl paper-panel rounded-2xl sm:rounded-3xl p-3 sm:p-4 mb-3 sm:mb-4 flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 sm:w-11 sm:h-11 shrink-0 rounded-xl bg-[#F08A3C] border-[3px] border-[#3A2E2A] flex items-center justify-center text-xl sm:text-2xl text-[#3A2E2A] shadow-[0_3px_0_rgba(58,46,42,.2)]"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.2L16 5l3 3L8.2 18.8z"/><path d="M14 7l3 3"/><path d="M4 20h7"/></svg></div>
        <div>
            <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight">著色快手 <span class="text-xs sm:text-sm font-bold text-[#6B5B53] align-middle">主控端</span></h1>
            <p id="mode-badge" class="text-[10px] sm:text-xs text-[#6B5B53] font-medium">連線模式檢查中…</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <div class="text-right">
            <p class="text-[10px] sm:text-xs text-[#6B5B53] font-bold">玩家加入網址（分享給大家）：</p>
            <p id="join-url" class="text-[10px] sm:text-xs font-mono text-[#2F6F69] font-bold break-all"></p>
        </div>
        <img id="join-qr" class="w-16 h-16 sm:w-20 sm:h-20 rounded-lg bg-[#FFFBF1] p-1 cursor-pointer" alt="掃描加入玩家端 QR Code" title="點擊放大 QR Code">
    </div>
</header>

<!-- ponytail: 用原生 <dialog>，不引任何 modal 套件 -->
<dialog id="qr-modal" class="rounded-2xl p-5 bg-[#FFFBF1] text-center backdrop:bg-[#3A2E2A]/70">
    <img id="qr-modal-img" class="w-[70vmin] h-[70vmin] max-w-[420px] max-h-[420px]" alt="放大的玩家端 QR Code">
    <p id="qr-modal-url" class="mt-2 text-xs font-mono text-[#3A2E2A] break-all"></p>
    <p class="mt-1 text-xs text-[#6B5B53]">點任一處關閉</p>
</dialog>

<main class="w-full max-w-5xl flex flex-col lg:flex-row gap-3 sm:gap-4">
    <div class="flex-grow paper-panel rounded-2xl sm:rounded-3xl p-4 sm:p-6 flex flex-col items-center gap-3">
        <div id="phase-banner" class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold chip text-[#9A4A0C] text-center">
            請設定題目參數，再點擊「開始遊戲」！
        </div>
        <div class="flex items-center gap-3 text-xs sm:text-sm">
            <div class="chip px-3 py-1 rounded-xl">關卡 <span id="current-round" class="font-black text-[#9A4A0C] font-mono">0</span></div>
            <div class="chip px-3 py-1 rounded-xl">已加入 <span id="player-count" class="font-black text-[#2F6F69] font-mono">0</span> 人</div>
        </div>
        <p id="pattern-title" class="text-sm sm:text-base font-bold text-[#3A2E2A]"></p>

        <div class="card-box w-[220px] h-[290px] sm:w-[280px] sm:h-[370px] relative my-1">
            <div id="preview-container" class="w-full h-full flex items-center justify-center p-1"></div>
        </div>

        <div class="w-full max-w-md flex flex-col items-center gap-1">
            <div class="w-full chip rounded-full h-3 sm:h-4 p-0.5 overflow-hidden relative">
                <div id="timer-bar" class="h-full bg-[#6CBF84] rounded-full transition-all duration-100" style="width:0%"></div>
            </div>
            <div id="timer-text" class="text-[#3A2E2A] font-mono font-bold text-xs">0 秒</div>
        </div>
    </div>

    <div class="w-full lg:w-72 paper-panel rounded-2xl sm:rounded-3xl p-4 flex flex-col">
        <h2 class="font-black text-base sm:text-lg text-[#9A4A0C] mb-3"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/><path d="M12 14v4M8 20h8"/></svg> 即時排行榜</h2>
        <div id="leaderboard" class="flex flex-col gap-2 overflow-y-auto flex-grow max-h-[420px]">
            <p class="text-sm text-[#6B5B53] text-center py-6">尚無玩家加入</p>
        </div>
    </div>
</main>

<footer class="w-full max-w-5xl paper-panel rounded-2xl sm:rounded-3xl p-3 sm:p-4 mt-3 sm:mt-4 flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">
        <div class="flex items-center gap-1 chip px-2 py-1 rounded-xl text-xs">
            <span class="font-bold text-[#9A4A0C]">記憶：</span>
            <select id="setting-mem-time" class="bg-transparent text-[#9A4A0C] font-bold outline-none cursor-pointer">
                <option value="5">5s</option>
                <option value="10" selected>10s</option>
                <option value="15">15s</option>
                <option value="20">20s</option>
            </select>
        </div>
        <div class="flex items-center gap-1 chip px-2 py-1 rounded-xl text-xs">
            <span class="font-bold text-[#2F5F99]">題數：</span>
            <input id="setting-round-count" type="number" min="1" max="99" value="5" placeholder="不限"
                class="w-14 bg-transparent text-[#2F5F99] font-bold outline-none text-center border-b border-[#3A2E2A] focus:border-[#3A2E2A]">
            <span class="text-[#2F5F99]">題（留空＝不限）</span>
        </div>
        <div class="flex items-center gap-1 chip px-2 py-1 rounded-xl text-xs">
            <span class="font-bold text-[#2F6F69]">著色：</span>
            <select id="setting-color-time" class="bg-transparent text-[#2F6F69] font-bold outline-none cursor-pointer">
                <option value="15">15s</option>
                <option value="30" selected>30s</option>
                <option value="45">45s</option>
                <option value="60">60s</option>
            </select>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button id="btn-reset" class="px-4 py-2.5 text-xs sm:text-sm rounded-xl btn btn-paper">重設</button>
        <button id="btn-start" class="px-6 py-2.5 sm:py-3 text-sm sm:text-base rounded-xl btn btn-orange">開始遊戲</button>
        <button id="btn-next" class="hidden px-6 py-2.5 sm:py-3 text-sm sm:text-base rounded-xl btn btn-green">下一關 →</button>
        <button id="btn-finish" class="hidden px-6 py-2.5 sm:py-3 text-sm sm:text-base rounded-xl btn btn-yellow">公布成績</button>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="patterns.js?v=2"></script>
<script src="audio.js?v=2"></script>
<script src="sync.js?v=2"></script>
<script>
const previewContainer = document.getElementById('preview-container');
const phaseBanner = document.getElementById('phase-banner');
const timerBar = document.getElementById('timer-bar');
const timerText = document.getElementById('timer-text');
const roundDisplay = document.getElementById('current-round');
const playerCountEl = document.getElementById('player-count');
const leaderboardEl = document.getElementById('leaderboard');
const modeBadge = document.getElementById('mode-badge');
const joinUrlEl = document.getElementById('join-url');
const patternTitleEl = document.getElementById('pattern-title');

const btnStart = document.getElementById('btn-start');
const btnNext = document.getElementById('btn-next');
const btnFinish = document.getElementById('btn-finish');
const btnReset = document.getElementById('btn-reset');
const settingMemTime = document.getElementById('setting-mem-time');
const settingColorTime = document.getElementById('setting-color-time');
const settingRoundCount = document.getElementById('setting-round-count');
// ponytail: 0 = 不限題數，維持原本手動開下一關的玩法
const totalRounds = () => parseInt(settingRoundCount.value) || 0;

modeBadge.textContent = LOCAL_MODE
    ? '本機測試模式（BroadcastChannel，僅同機分頁互通）'
    : '已連線 Firebase，可跨裝置遊玩';
const joinUrl = new URL('player.html', location.href).href;
joinUrlEl.textContent = joinUrl;
const qrSrc = (size) => `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(joinUrl)}`;
document.getElementById('join-qr').src = qrSrc(200);
const qrModal = document.getElementById('qr-modal');
document.getElementById('qr-modal-img').src = qrSrc(600);
document.getElementById('qr-modal-url').textContent = joinUrl;
document.getElementById('join-qr').addEventListener('click', () => qrModal.showModal());
qrModal.addEventListener('click', () => qrModal.close());

let currentRoundIndex = 0;
let currentPatternIndex = -1;
let timerInterval = null;

btnStart.addEventListener('click', () => { soundManager.play('flip'); startRound(); });
btnNext.addEventListener('click', () => { soundManager.play('flip'); startRound(); });
btnFinish.addEventListener('click', () => {
    soundManager.play('win');
    writeRoom({ status: 'finished' });
    phaseBanner.textContent = '🏆 成績已公布！玩家手機會顯示最終排名';
});
btnReset.addEventListener('click', () => {
    if (!confirm('確定要清空排行榜並重新開始嗎？')) return;
    clearInterval(timerInterval);
    currentRoundIndex = 0;
    roundDisplay.textContent = '0';
    patternTitleEl.textContent = '';
    previewContainer.innerHTML = '';
    btnStart.classList.remove('hidden');
    btnNext.classList.add('hidden');
    btnFinish.classList.add('hidden');
    phaseBanner.textContent = '請設定題目參數，再點擊「開始遊戲」！';
    resetRoom();
});

function pickPatternIndex() {
    let idx;
    do { idx = Math.floor(Math.random() * GAME_PATTERNS.length); }
    while (idx === currentPatternIndex && GAME_PATTERNS.length > 1);
    return idx;
}

function startRound() {
    clearInterval(timerInterval);
    currentRoundIndex += 1;
    roundDisplay.textContent = totalRounds() ? `${currentRoundIndex} / ${totalRounds()}` : currentRoundIndex;
    btnStart.classList.add('hidden');
    btnNext.classList.add('hidden');
    btnFinish.classList.add('hidden');

    currentPatternIndex = pickPatternIndex();
    const pattern = GAME_PATTERNS[currentPatternIndex];
    const memTime = parseInt(settingMemTime.value);
    const colorTime = parseInt(settingColorTime.value);

    patternTitleEl.textContent = pattern.name;
    previewContainer.innerHTML = pattern.getSvg(pattern.solution);

    const round = { index: currentRoundIndex, patternId: pattern.id, memTime, colorTime, phaseStartAt: Date.now() };
    writeRoom({ status: 'memorize', round });

    phaseBanner.textContent = `記憶階段：玩家有 ${memTime} 秒記住這張圖案！`;
    runTimer(memTime, () => enterColorPhase(round, pattern));
}

function enterColorPhase(round, pattern) {
    phaseBanner.textContent = `著色階段：玩家有 ${round.colorTime} 秒在自己手機上填色！`;
    previewContainer.innerHTML = pattern.getSvg({});
    const updatedRound = { ...round, phaseStartAt: Date.now() };
    writeRoom({ status: 'color', round: updatedRound });
    runTimer(round.colorTime, () => endRound(updatedRound));
}

function endRound(round) {
    const total = totalRounds();
    const isLastRound = total > 0 && currentRoundIndex >= total;
    phaseBanner.textContent = isLastRound
        ? `🎉 已完成全部 ${total} 關！點「公布成績」結束比賽`
        : '本關結束！開下一關繼續比賽，或直接公布成績';
    writeRoom({ status: 'ended', round });
    if (!isLastRound) btnNext.classList.remove('hidden');
    btnFinish.classList.remove('hidden');
}

function runTimer(seconds, onDone) {
    let timeLeft = seconds;
    updateTimerBar(timeLeft, seconds);
    timerInterval = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); updateTimerBar(0, seconds); onDone(); }
        else updateTimerBar(timeLeft, seconds);
    }, 1000);
}

function updateTimerBar(timeLeft, maxTime) {
    const pct = maxTime > 0 ? Math.max(0, Math.min(100, (timeLeft / maxTime) * 100)) : 0;
    timerBar.style.width = pct + '%';
    timerText.textContent = timeLeft + ' 秒';
}

function renderLeaderboard(players) {
    const list = Object.values(players || {}).sort((a, b) => b.score - a.score);
    playerCountEl.textContent = list.length;
    if (list.length === 0) {
        leaderboardEl.innerHTML = '<p class="text-sm text-[#6B5B53] text-center py-6">尚無玩家加入</p>';
        return;
    }
    leaderboardEl.innerHTML = list.map((p, i) => `
        <div class="chip flex items-center justify-between px-3 py-2 rounded-xl ${i === 0 ? 'bg-[#F2C14E]' : 'bg-[#F2E8CF]'}">
            <span class="font-bold text-sm text-[#3A2E2A]">${i + 1}. ${p.name}${p.streak >= 2 ? ' 🔥' : ''}</span>
            <span class="font-mono font-black text-[#2F6F69]">${String(p.score).padStart(4, '0')}</span>
        </div>
    `).join('');
}

onPlayers(renderLeaderboard);
</script>
</body>
</html>
